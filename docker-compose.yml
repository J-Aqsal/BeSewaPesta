services:
  web:
    build: .
    ports:
      - "8000"
    env_file:
      - .env
    volumes:
      - .:/app
    environment:
      - VIRTUAL_HOST=besewapestakita.duckdns.org
      - LETSENCRYPT_HOST=besewapestakita.duckdns.org
      - VIRTUAL_PORT=8000
    restart: always

networks:
  default:
    name: aplikasi-penyewaan-alat-pesta_default 
    external: true
